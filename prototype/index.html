<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101014">
<title>Aldo Ciné — Test React & Framer Motion</title>
<link rel="stylesheet" href="./styles.css">
<script type="importmap">{"imports":{"react":"https://esm.sh/react@18.3.1","react/jsx-runtime":"https://esm.sh/react@18.3.1/jsx-runtime","react/jsx-dev-runtime":"https://esm.sh/react@18.3.1/jsx-dev-runtime","react-dom/client":"https://esm.sh/react-dom@18.3.1/client?external=react"}}</script>
<style>
.boot-message{max-width:680px;margin:12vh auto;padding:28px;border:1px solid #45454d;border-radius:20px;background:#19191e;color:#f5f5f7}
.boot-message h1{font-size:25px;margin:0 0 12px}.boot-message p{color:#c8c8d0;line-height:1.5}
.boot-error{margin-top:16px;padding:12px;border-radius:10px;background:#3b171b;color:#ffd9dd;white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.5 monospace}
</style>
</head>
<body>
<div id="root">
  <main class="boot-message">
    <h1>Aldo Ciné — aperçu de test</h1>
    <p>La page est chargée, mais l'interface interactive n'a pas encore démarré. Vérification des dépendances React en cours…</p>
    <p id="boot-status">Si ce message reste affiché, le chargement JavaScript a échoué.</p>
    <div id="boot-error" class="boot-error" hidden></div>
  </main>
</div>
<script>
(function(){
  function showError(message){
    var status=document.getElementById("boot-status");
    var panel=document.getElementById("boot-error");
    if(status) status.textContent="Le prototype n'a pas pu démarrer. Voici l'erreur détectée :";
    if(panel){panel.hidden=false;panel.textContent=String(message||"Erreur JavaScript inconnue");}
  }
  window.addEventListener("error",function(event){
    showError(event.message || (event.target && event.target.src) || "Échec de chargement d'une ressource JavaScript");
  },true);
  window.addEventListener("unhandledrejection",function(event){
    showError(event.reason && (event.reason.stack || event.reason.message) || event.reason || "Promesse rejetée");
  });
})();
</script>
<script type="module" src="./app.js"></script>
</body>
</html>
